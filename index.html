<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalGuard 음영 현황</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#eef1ef;--panel:#fff;--ink:#18262e;--sub:#5d6d75;--line:#d5dcd9;
  --ok:#2f7d5b;--warn:#c98a12;--bad:#b83a2e;--brand:#1d4d63}
@media (prefers-color-scheme:dark){
  :root{--bg:#10191e;--panel:#182329;--ink:#e6edef;--sub:#93a4ab;--line:#2a3a42;
        --ok:#52b588;--warn:#e0a93a;--bad:#e2685b;--brand:#6fb1cc}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
  font:15px/1.5 "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 16px;background:var(--brand);color:#fff;flex:none}
header h1{margin:0;font-size:17px}
.who{font-size:13px;display:flex;gap:10px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);padding:5px 10px}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.hidden{display:none!important}
#login{max-width:340px;width:calc(100% - 32px);margin:12vh auto;padding:24px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px}
#login h2{margin:0 0 4px;font-size:20px}
#login p{margin:0 0 16px;color:var(--sub);font-size:13px}
label{display:block;font-size:13px;color:var(--sub);margin-top:12px}
input{width:100%;margin-top:4px;padding:9px 10px;font:inherit;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:6px}
#login button{width:100%;margin-top:18px;background:var(--brand);color:#fff;border:0;padding:10px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1.2em}
.wrap{flex:1;min-height:0;display:flex}
#map{flex:1;min-width:0}
#side{width:290px;flex:none;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:14px}
.sum{display:flex;gap:10px;margin-bottom:12px}
.sum div{flex:1;background:var(--bg);border-radius:8px;padding:8px 10px}
.sum b{display:block;font-size:22px}.sum span{font-size:12px;color:var(--sub)}
#side h2{font-size:14px;margin:0 0 8px}
#days{list-style:none;margin:8px 0 0;padding:0}
#days button{display:block;width:100%;text-align:left;margin-bottom:6px;padding:7px 10px;position:relative;overflow:hidden}
#days button.on{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
#days .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--bad);opacity:.6}
#days .d{font-weight:600}#days .m{float:right;color:var(--sub);font-size:13px}
@media (max-width:700px){
  .wrap{flex-direction:column}
  #side{width:100%;max-height:42%;border-left:0;border-top:1px solid var(--line)}
}
.pop{min-width:150px;line-height:1.6}
.pop b{font-size:15px}
.pop .row{color:#333}
.pop .acts{margin-top:6px}
.pop button{color:#111;background:#fff;border-color:#bbb;margin-right:4px;font-size:13px;padding:2px 8px}
</style>
</head>
<body>
<header>
  <h1>SignalGuard 음영 현황</h1>
  <div class="who hidden" id="who"><span id="whoText"></span><button id="logout">로그아웃</button></div>
</header>

<section id="login">
  <h2>로그인</h2>
  <p>관리자가 만들어 준 계정으로 로그인하세요.</p>
  <form id="loginForm">
    <label>아이디<input id="uid" autocomplete="username" required></label>
    <label>비밀번호<input id="pw" type="password" autocomplete="current-password" required></label>
    <button type="submit">로그인</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div class="wrap hidden" id="wrap">
  <div id="map"></div>
  <aside id="side">
    <div class="sum"><div><b id="sTotal">0</b><span id="sTotalL">전체 기록</span></div><div><b id="sMin">-</b><span>최저 RSRP</span></div></div>
    <h2>날짜별 현황</h2>
    <button id="allDays">전체 보기</button>
    <ul id="days"></ul>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, getDoc, updateDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== Firebase 콘솔 > 프로젝트 설정 > 웹 앱의 값으로 교체 ===== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};
const ID_DOMAIN = "signalguard.app"; // 계정 생성 시 아이디@이 도메인 으로 등록
/* ============================================================= */

const auth = getAuth(initializeApp(firebaseConfig));
const db = getFirestore();
const $ = id => document.getElementById(id);
let isAdmin = false, unsub = null, map = null, layer = null, fitted = false;

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginErr").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("uid").value.trim().toLowerCase() + "@" + ID_DOMAIN, $("pw").value);
  } catch { $("loginErr").textContent = "아이디 또는 비밀번호가 올바르지 않습니다."; }
});
$("logout").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, async user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) { show(false); return; }
  let role = null;
  try { const s = await getDoc(doc(db, "users", user.uid)); role = s.exists() ? s.data().role : null; } catch {}
  if (role !== "admin" && role !== "viewer") {
    $("loginErr").textContent = "이 계정은 조회 권한이 없습니다.";
    await signOut(auth); return;
  }
  isAdmin = role === "admin";
  $("whoText").textContent = user.email.split("@")[0] + (isAdmin ? " (관리자)" : "");
  show(true); initMap(); fitted = false;
  unsub = onSnapshot(query(collection(db, "records"), orderBy("ts", "desc"), limit(500)),
    snap => render(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
});

function show(on) {
  $("login").classList.toggle("hidden", on);
  $("wrap").classList.toggle("hidden", !on);
  $("who").classList.toggle("hidden", !on);
}

function initMap() {
  if (!map) {
    map = L.map("map").setView([36.5, 127.8], 7);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 0);
}

const toDate = t => t && t.toDate ? t.toDate() : new Date(t);
const fmt = d => d.toLocaleString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
const cls = r => r.rsrp <= -120 ? "bad" : r.rsrp <= -110 ? "warn" : "ok";

function popup(r) {
  const el = document.createElement("div"); el.className = "pop";
  const line = (k, v) => { const d = document.createElement("div"); d.className = "row"; d.textContent = k + ": " + v; el.appendChild(d); };
  const t = document.createElement("b"); t.textContent = "RSRP " + (r.rsrp ?? "-") + " dBm"; el.appendChild(t);
  line("시각", fmt(toDate(r.ts)));
  if (r.level) line("단계", r.level);
  if (r.region) line("지역", r.region);
  line("좌표", r.lat.toFixed(5) + ", " + r.lng.toFixed(5));
  if (r.memo) line("메모", r.memo);
  if (isAdmin) {
    const a = document.createElement("div"); a.className = "acts";
    const m = document.createElement("button"); m.textContent = "메모";
    m.onclick = async () => { const v = prompt("메모 입력", r.memo || ""); if (v !== null) await updateDoc(doc(db, "records", r.id), { memo: v }); };
    const x = document.createElement("button"); x.textContent = "삭제";
    x.onclick = async () => { if (confirm("이 기록을 삭제할까요?")) await deleteDoc(doc(db, "records", r.id)); };
    a.append(m, x); el.appendChild(a);
  }
  return el;
}

let all = [], selDay = null;
const dayKey = r => { const d = toDate(r.ts);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

function render(list) {
  all = list;
  if (selDay && !list.some(r => dayKey(r) === selDay)) selDay = null;
  draw();
}

function draw() {
  // 날짜별 집계
  const g = {};
  for (const r of all) {
    const k = dayKey(r); const o = g[k] || (g[k] = { n: 0, min: null });
    o.n++; if (typeof r.rsrp === "number" && (o.min === null || r.rsrp < o.min)) o.min = r.rsrp;
  }
  const keys = Object.keys(g).sort().reverse(), max = Math.max(1, ...keys.map(k => g[k].n));
  const ul = $("days"); ul.innerHTML = "";
  for (const k of keys) {
    const li = document.createElement("li"), b = document.createElement("button");
    if (k === selDay) b.className = "on";
    const d = document.createElement("span"); d.className = "d"; d.textContent = k.slice(5).replace("-", "/") + "  " + g[k].n + "건";
    const m = document.createElement("span"); m.className = "m"; m.textContent = g[k].min ?? "-";
    const bar = document.createElement("i"); bar.className = "bar"; bar.style.width = (g[k].n / max * 100) + "%";
    b.append(d, m, bar);
    b.onclick = () => { selDay = (selDay === k ? null : k); fitted = false; draw(); };
    li.appendChild(b); ul.appendChild(li);
  }
  if (!keys.length) { const li = document.createElement("li"); li.textContent = "기록이 없습니다."; ul.appendChild(li); }

  // 지도 + 요약 (선택한 날짜만)
  const shown = selDay ? all.filter(r => dayKey(r) === selDay) : all;
  $("sTotal").textContent = shown.length;
  $("sTotalL").textContent = selDay ? selDay.slice(5).replace("-", "/") + " 기록" : "전체 기록";
  const mins = shown.map(r => r.rsrp).filter(v => typeof v === "number");
  $("sMin").textContent = mins.length ? Math.min(...mins) : "-";

  layer.clearLayers();
  const pts = [], css = getComputedStyle(document.documentElement);
  for (const r of shown) {
    if (typeof r.lat !== "number" || typeof r.lng !== "number") continue;
    const c = css.getPropertyValue("--" + cls(r)).trim();
    L.circleMarker([r.lat, r.lng], { radius: 9, color: "#fff", weight: 2, fillColor: c, fillOpacity: .9 })
      .bindPopup(() => popup(r)).addTo(layer);
    pts.push([r.lat, r.lng]);
  }
  if (pts.length && !fitted) { map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 }); fitted = true; }
}
$("allDays").addEventListener("click", () => { selDay = null; fitted = false; draw(); });
</script>
</body>
</html>
